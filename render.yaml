services:
  - type: web
    name: flask-gallery-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        value: hello123
      - key: DATABASE_URL
        fromDatabase:
          name: gallery-db
          property: connectionString

databases:
  - name: gallery-db